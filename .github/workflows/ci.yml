name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_BRANCH: ${{ github.event.pull_request.number || github.ref_name }}
  NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  NX_CLOUD_USE_IO_SNAPSHOTS: true
  NX_CLOUD_AGENT_PREFETCH_SECONDS: 60
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx-cloud start-workers
        id: start_workers
      - name: Run all checks concurrently
        run: |
          pids=()
          npx nx-cloud record -- nx format:check & pids+=($!)
          npx nx-cloud record -- nx sync:check & pids+=($!)
          npx nx validate --no-agents & pids+=($!)
          npx nx affected -t build typecheck lint test e2e-ci & pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
      - name: Stop workers
        if: ${{ always() && steps.start_workers.outcome == 'success' }}
        run: npx nx-cloud stop-all-workers

  workers:
    name: Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    env:
      NX_AGENT_NAME: manual-${{ matrix.worker }}
      # Manual workers need this to select V4; packing and budgets use workspace settings.
      NX_CLOUD_CONTINUOUS_ASSIGNMENT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx-cloud start-worker
