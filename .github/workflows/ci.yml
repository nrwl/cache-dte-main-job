name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_BRANCH: ${{ github.event.pull_request.number || github.ref_name }}
  NX_CI_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all checks concurrently
        run: |
          # Build once before starting the browser suite and the other checks.
          npx nx run @org/shop:build --no-agents

          pids=()
          npx nx-cloud record -- nx format:check & pids+=($!)
          npx nx-cloud record -- nx sync:check & pids+=($!)
          npx nx validate --no-agents & pids+=($!)
          # Start the serial browser suite immediately, alongside three local
          # check processes, so it does not wait behind the other tasks.
          npx nx run @org/shop-e2e:e2e --no-agents & pids+=($!)
          npx nx run-many -t build typecheck lint test --parallel=3 --no-agents & pids+=($!)

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
